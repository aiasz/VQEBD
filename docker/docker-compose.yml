# =============================================================================
# VQEBD — docker-compose (Fázis 0)
# Szerző: Kormos Attila · Megvalósítás MI-eszközzel: Claude (Anthropic) — MIT licenc
# =============================================================================
# Fázis 0-ban SZÁNDÉKOSAN csak egyetlen szolgáltatás volt. A `scheduler` a Fázis 6-tól,
# a `dashboard` a Fázis 8-tól van itt.
#
# EGYPARANCSOS INDÍTÁS a saját gépen (a repó gyökeréből):
#     docker compose -f docker/docker-compose.yml up -d --build dashboard
# Utána: http://localhost:8501
#
# A `dashboard` NINCS hitelesítéssel védve, ezért a port csak a gazdagép saját hurokcímére
# (127.0.0.1) van kötve: a hálózaton kívülről nem érhető el. Ne nyisd ki a 0.0.0.0-ra
# hitelesítő reverse proxy vagy VPN nélkül (docs/07_dashboard.md, 6. pont).
#
# A `scheduler` CSAK szimulátort indít: az `--allow-hardware` kapcsolót az ütemező
# az `--every` mellett elutasítja (ADR-0008). Valódi QPU-t kézi, egyszeri futás indít.
#
# Futtatás a repó gyökeréből:
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm app python --version
# =============================================================================

name: vqebd

services:
  app:
    build:
      context: ..                 # a build-kontextus a repó GYÖKERE, nem a docker/ mappa
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64             # lebegőpontos determinizmus (ADR-0005)
      args:
        APP_UID: "1000"
        APP_GID: "1000"
    image: vqebd:1.0.0
    container_name: vqebd-app
    init: true                    # helyes jelkezelés (Ctrl+C), zombie-folyamatok elkerülése
    working_dir: /app
    environment:
      PYTHONHASHSEED: "0"
      PYTHONPATH: /app/src
      TZ: Europe/Budapest
    env_file:
      - path: ../.env             # az IBM-token ide kerül (Fázis 2); SOHA nem a repóba
        required: false           # Fázis 0-ban még nincs .env — ne akadjon el
    volumes:
      # Fejlesztői bind-mount: a forrás és a tesztek élőben szerkeszthetők,
      # újraépítés nélkül. A `data/` nevesített volume-ként, hogy a konténerben
      # keletkezett fájlok ne szennyezzék a gazdagép jogosultságait.
      - ../src:/app/src:ro
      - ../tests:/app/tests:ro
      - ../scripts:/app/scripts:ro
      - vqebd-data:/app/data
    command: ["python", "--version"]

  # --- Fázis 6: ütemezett szimulátoros pipeline (ADR-0008) -----------------------
  # Indítás:  docker compose -f docker/docker-compose.yml up -d scheduler
  # Napló:    a vqebd-data volume `logs/` mappájában (JSON-soros), a hibák az
  #           adatbázis `run_failures` táblájában. Leállítás: `docker compose stop scheduler`.
  scheduler:
    image: vqebd:1.0.0
    container_name: vqebd-scheduler
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      PYTHONHASHSEED: "0"
      PYTHONPATH: /app/src
      TZ: Europe/Budapest
    volumes:
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
      - vqebd-data:/app/data
    command:
      [
        "python", "-m", "vqebd.scheduler",
        "--preset", "f5-smoke",
        "--every", "24h",
        "--db", "/app/data/db/scheduler.sqlite",
        "--export", "/app/data/exports/scheduler_f5_smoke.json",
        "--log-dir", "/app/data/logs",
        "--lock", "/app/data/scheduler.lock",
      ]

  # --- Fázis 8: a dashboard (csak olvasó nézegető) ----------------------------------
  # Indítás:   docker compose -f docker/docker-compose.yml up -d --build dashboard
  # Leállítás: docker compose -f docker/docker-compose.yml stop dashboard
  # Naplók:    docker compose -f docker/docker-compose.yml logs -f dashboard
  #
  # Adatforrások (a dashboard automatikusan felderíti őket):
  #   - /app/data/db/*.sqlite   a `vqebd-data` volume (itt ír a `scheduler` és az `app`);
  #                             a dashboard csak olvasásra nyitja (read_only=True). A volume
  #                             szándékosan nem `:ro`, mert a WAL módú SQLite olvasóinak is
  #                             szükségük lehet a -shm fájlra.
  #   - /app/docs/figures/data  a verziózott JSON-exportok (a repóból, csak olvasásra).
  # Nincs token, nincs env_file: a dashboard sosem ér el hálózatot vagy QPU-t.
  dashboard:
    image: vqebd:1.0.0
    container_name: vqebd-dashboard
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      PYTHONHASHSEED: "0"
      PYTHONPATH: /app/src
      TZ: Europe/Budapest
      VQEBD_DASHBOARD_ROOT: /app
    ports:
      # Csak a gazdagép hurokcíméről érhető el. Más port: VQEBD_DASHBOARD_PORT=8600
      - "127.0.0.1:${VQEBD_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ../src:/app/src:ro
      - ../dashboard:/app/dashboard:ro
      - ../docs/figures/data:/app/docs/figures/data:ro
      - vqebd-data:/app/data
    command:
      [
        "python", "-m", "streamlit", "run", "dashboard/app.py",
        "--server.address", "0.0.0.0",
        "--server.port", "8501",
        "--server.headless", "true",
        "--browser.gatherUsageStats", "false",
      ]
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3).read() == b'ok' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vqebd-data:
    name: vqebd-data
